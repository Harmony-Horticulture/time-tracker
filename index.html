<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2E5240">
  <title>Harmony Horticulture Time Tracker</title>
  <!-- Light and dark browser tabs get their own icon. Safari uses favicon.png. -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" type="image/png" href="assets/favicon-light.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="assets/favicon-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Sign in -->
  <div id="authView" class="auth-wrap hidden">
    <div class="auth-card">
      <img class="logo" src="assets/logo.png" alt="Harmony Horticulture">
      <p class="eyebrow">Time Tracker</p>
      <div id="authContent"></div>
    </div>
  </div>

  <!-- App -->
  <div id="appView" class="shell hidden">
    <aside class="sidebar">
      <div class="logo-block"><img class="logo" src="assets/logo-reversed.png" alt="Harmony Horticulture"></div>
      <nav id="sideNav"></nav>
      <div class="who">
        <div id="whoName"></div>
        <div id="whoRole"></div>
        <button id="signOutBtn" type="button">Sign out</button>
      </div>
    </aside>
    <header class="topbar">
      <img src="assets/mark-reversed.png" alt="Harmony Horticulture">
      <button id="signOutBtnMobile" type="button">Sign out</button>
    </header>
    <main class="main">
      <div class="container">
        <div id="demoBanner" class="demo-banner hidden">
          Demo mode: sample data saved in this browser only. Add your Supabase keys in js/config.js to go live.
          <button type="button" class="small secondary" id="resetDemoBtn" style="margin-left:8px">Reset demo data</button>
        </div>
        <section id="view-log" class="view"></section>
        <section id="view-mytime" class="view hidden"></section>
        <section id="view-review" class="view hidden"></section>
        <section id="view-people" class="view hidden"></section>
        <section id="view-lists" class="view hidden"></section>
      </div>
    </main>
    <nav class="bottomnav" id="bottomNav"></nav>
  </div>

  <div id="loading" class="auth-wrap"><p style="color:#595959">Loading…</p></div>
  <div id="modalRoot"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="vendor/supabase.min.js"></script>
  <script src="vendor/exceljs.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/importers.js"></script>
  <script src="js/store.js"></script>
  <script src="js/exports.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
